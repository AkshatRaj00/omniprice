user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Buffer & Size Hardening (Anti-Buffer-Overflow / Slowloris)
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 1m;
    large_client_header_buffers 2 1k;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Rate Limiting Zones (Kernel/Proxy Level)
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    upstream app_backend {
        server omniprice-core:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Drop Connections with No Host or Invalid Host
        if ($host !~ ^[a-zA-Z0-9.:_-]+$) {
            return 444;
        }

        # OWASP Military Hardened Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:;" always;

        # Honeypot Traps - Drop instantly with 444 (No Response)
        location ~* ^/(\.env|\.git|wp-login|admin|phpmyadmin|actuator|config|debug|shell) {
            return 444;
        }

        location / {
            limit_req zone=req_limit_per_ip burst=10 nodelay;
            limit_conn conn_limit_per_ip 10;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Anti-Hop Isolation
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }
    }
}
