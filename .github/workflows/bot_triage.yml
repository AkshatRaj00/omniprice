name: Community & Issue Triage Bot
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Thank you for opening an issue on OmniPrice!** Automated triage engine has recorded this. Maintainers will review it shortly.'
            })

      - name: Welcome new PRs
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚡ **Awesome contribution!** Thanks for opening a PR to OmniPrice. CI security checks and automated linters are scanning your branch.'
            })
